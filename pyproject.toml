[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pride-esim"
version = "0.1.0"
description = "Synthetic printed-part data generation and grid conversion tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "h5py",
    "matplotlib",
]

[project.scripts]
pride-esim-diw = "pride_esim.diw:main"
pride-esim-diw-post = "pride_esim.diw_post:main"
pride-esim-engineering = "pride_esim.engineering:main"
pride-esim-physics-pre = "pride_esim.physics_pre:main"
pride-esim-physics = "pride_esim.physics:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pride_esim*"]
